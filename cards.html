  <nav class="site-nav scrolled" id="nav">
    <div class="nav-inner">

      </ul>

  </nav>

  <div class="page-hero">
    <div class="container">
      <span class="section-label reveal">MEGA CREW // CARD COLLECTION</span>
      <h1 class="reveal" data-delay="1">Inside the<br><em>Detective's Head.</em></h1>
      <p class="page-hero-sub reveal" data-delay="2">22 base cards. 22 MEGA upgrades. Each bot is real — running right now on a Pi 5 in Hazel Green, Alabama. Click any card to flip it.</p>

      <div class="card-filters reveal" data-delay="3">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="Legendary">Legendary</button>
        <button class="filter-btn" data-filter="Epic">Epic</button>
        <button class="filter-btn" data-filter="Rare">Rare</button>
        <button class="filter-btn" data-filter="Uncommon">Uncommon</button>
        <button class="filter-btn" data-filter="Secret">Secret</button>
        <button class="filter-btn" data-zone="Brain">Brain</button>
        <button class="filter-btn" data-zone="Left Hand">Left Hand</button>
        <button class="filter-btn" data-zone="Right Hand">Right Hand</button>
      </div>
    </div>
  </div>

  <section class="cards-section">
    <div class="container">
      <div class="mega-crew-grid" id="cards-grid">
        <!-- JS renders cards here -->
      </div>
    </div>
  </section>

  <!-- Card Modal -->
  <div class="card-modal" id="card-modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-inner">
      <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
      <div class="modal-card-wrap" id="modal-card-wrap">
        <!-- Full card detail renders here -->
      </div>
    </div>
